<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="radar:titolo" content="Asili nido, cerca il tuo Comune">
<meta name="radar:pubblicato" content="2026-11-14">
<meta name="radar:modificato" content="2026-11-17">
<meta name="radar:altezza-360" content="1068">
<meta name="radar:altezza-640" content="1340">
<meta name="radar:modello" content="radar-dataviz">
<title>Asili nido, cerca il tuo Comune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
<script src="../assets/radar.js"></script>
<style>
  .cerca-box { position: relative; margin: 24px 0 0; }
  .cerca { width: 100%; padding: 10px 12px; font: 15px var(--sans); color: var(--ink); background: var(--tip-bg);
           border: 1px solid var(--grey-light); border-radius: 2px; }
  .cerca:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
  .sugg { position: absolute; z-index: 20; left: 0; right: 0; margin: 2px 0 0; padding: 0; list-style: none;
          background: var(--tip-bg); border: 1px solid var(--rule); max-height: 260px; overflow: auto; font-size: 14px; }
  .sugg li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--rule); }
  .sugg li[aria-selected="true"], .sugg li:hover { background: var(--rule); }
  .sugg small { color: var(--ink-2); }
  .livelli { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .livelli button { font: 500 13px var(--sans); padding: 6px 12px; border-radius: 999px; cursor: pointer;
                    border: 1px solid var(--grey-light); background: transparent; color: var(--ink); }
  .livelli button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .zona { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; align-items: flex-start; }
  .mappa { flex: 1 1 380px; min-width: 0; position: relative; }
  .mappa svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
  path.c { stroke: var(--bg); stroke-width: 0.15; vector-effect: non-scaling-stroke; cursor: pointer; }
  svg.zoom path.c { stroke-width: 0.8; }
  path.c:hover { stroke: var(--ink); stroke-width: 1.2; }
  path.c.sel { stroke: var(--ink) !important; stroke-width: 2.5 !important; }
  path.c.fuori { stroke: var(--grey-light); }
  path.reg { fill: none; stroke: var(--grey-2); stroke-width: 0.6; vector-effect: non-scaling-stroke; pointer-events: none; }
  .italia { position: absolute; right: 0; top: 0; font: 500 12px var(--sans); padding: 5px 10px; border-radius: 999px;
            border: 1px solid var(--grey-light); background: var(--bg); color: var(--ink); cursor: pointer; }
  .italia[hidden] { display: none; }
  .scheda { flex: 1 1 240px; min-width: 0; font-size: 14px; line-height: 1.45; border-top: 2px solid var(--ink); padding-top: 10px; }
  .scheda h2 { font: 700 24px/1.1 var(--serif); margin: 0 0 2px; color: var(--title); }
  .scheda .sotto { color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }
  .voce { border-top: 1px solid var(--rule); padding: 9px 0; }
  .et { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
  .num { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .num.rosso { color: var(--red); }
  .scheda .si { color: var(--red); font-weight: 700; }
  @media (max-width: 639px) { .scheda { order: -1; } }
  /* Comune cercato: la mappa va sullo sfondo, sfocata, e la scheda resta in primo piano */
  .mappa svg, .mappa .italia { transition: filter .5s ease, opacity .5s ease; }
  .zona.cercato { display: grid; grid-template-columns: minmax(0, 1fr); }
  .zona.cercato > .mappa, .zona.cercato > .scheda { grid-area: 1 / 1; }
  .zona.cercato > .mappa { pointer-events: none; }
  .zona.cercato > .mappa svg { filter: blur(5px); opacity: .55; }
  .zona.cercato > .mappa .italia { display: none; }
  .zona.cercato > .scheda { position: relative; z-index: 2; align-self: start; justify-self: center; width: 100%; max-width: 460px;
                            margin-top: 12px; padding: 12px 16px 6px; border-top-width: 3px;
                            background: color-mix(in srgb, var(--bg) 82%, transparent); }
  .torna { display: inline-block; margin: 0 0 10px; font: 500 12px var(--sans); padding: 5px 10px; border-radius: 999px;
           border: 1px solid var(--grey-light); background: var(--bg); color: var(--ink); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .mappa svg { transition: none; } }
</style>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title">Un Comune su tre ha il sindaco commissario per i nidi. Cerca il tuo</h1>
    <p class="r-sub" id="sub">Il livello da garantire entro il 2027 è di 33 posti ogni 100 bambini</p>
  </header>

  <div class="cerca-box">
    <input class="cerca" id="cerca" type="search" placeholder="Scrivi il nome del tuo Comune" aria-label="Cerca un Comune"
           autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg">
    <ul class="sugg" id="sugg" role="listbox" hidden></ul>
  </div>
  <div class="livelli" id="livelli" role="group" aria-label="Cosa mostra la mappa"></div>

  <div class="zona">
    <figure class="mappa r-chart" id="mappa" style="margin:0">
      <button class="italia" id="italia" type="button" hidden>Torna all’Italia</button>
    </figure>
    <div class="scheda" id="scheda" aria-live="polite"></div>
  </div>
  <div class="r-key" id="chiave"></div>

  <footer class="r-foot">
    <span>Fonte: Ministero dell’Interno (decreti 5 novembre 2025 e 10 marzo 2026), Istat, Italia Domani (Progetti del Pnrr)</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt;

  function altezza() {
    var el = document.querySelector(".radar");
    if (!el || window.parent === window) return;
    window.parent.postMessage({ tipo: "radar-altezza", altezza: Math.ceil(el.getBoundingClientRect().height), indirizzo: location.href }, "*");
  }
  var tA;
  function altezzaPresto() { clearTimeout(tA); tA = setTimeout(altezza, 60); }
  window.addEventListener("load", altezza);
  window.addEventListener("resize", altezzaPresto);
  if (window.ResizeObserver) new ResizeObserver(altezzaPresto).observe(document.querySelector(".radar"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(altezzaPresto);

  var LIV = [
    { nome: "Sindaco commissario", campo: "comm", titolo: "Sindaco commissario per i nidi, 2024",
      classi: [["No", "var(--grey-5)"], ["Sì, obiettivo non raggiunto", "var(--red-3)"], ["Sì, certificazione non inviata", "var(--red-1)"]] },
    { nome: "Posti ogni 100 bambini", campo: "cl", titolo: "Posti ogni 100 bambini, 2024/2025",
      classi: [["Nessun posto", "var(--red-2)"], ["Meno di 15", "var(--red-4)"], ["15-33", "var(--red-5)"],
               ["33-45", "var(--blue-4)"], ["45 e più", "var(--blue-2)"]] }
  ];
  var ND = "var(--grey-3)", FUORI = "var(--bg)";

  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function eur(x) {
    if (!x) return "0 euro";
    if (x >= 1e6) return fmt(x / 1e6, 1).replace(/,0$/, "") + " milioni di euro";
    if (x >= 1e4) return fmt(Math.round(x / 1e3)) + "mila euro";
    return fmt(x) + " euro";
  }
  function classe(r) {
    if (r.p100 == null) return -1;
    if (r.posti === 0) return 0;
    return r.p100 < 15 ? 1 : r.p100 < 33 ? 2 : r.p100 < 45 ? 3 : 4;
  }

  Promise.all([R.loadCSV("../data/comuni.csv"), fetch("../data/comuni-geo.json", { cache: "no-cache" }).then(function (r) { return r.json(); })])
  .then(function (res) {
    var rows = res[0], G = res[1];
    var perId = {}, rec = [];
    rows.forEach(function (r) {
      var o = { id: r["Codice"], nome: r["Comune"], sotto: r["Provincia"] + ", " + r["Regione"], dentro: r["Nel Fondo"] === "1",
                comm: r["Commissariamento"] === "" ? null : +r["Commissariamento"], p100: R.num(r["Posti ogni 100 bambini"]),
                posti: R.num(r["Posti"]), agg: R.num(r["Posti da aggiungere 2026"]), euro: R.num(r["Euro 2026"]),
                pn: R.num(r["Progetti Pnrr"]), pc: R.num(r["Progetti Pnrr conclusi"]), peur: R.num(r["Euro Pnrr"]) };
      o.cl = o.dentro ? classe(o) : null;
      o._n = norm(o.nome);
      perId[o.id] = o; rec.push(o);
    });
    var nel = rec.filter(function (r) { return r.dentro; });
    var nComm = nel.filter(function (r) { return r.comm > 0; }).length;

    // ---- Scheda ----
    var sch = document.getElementById("scheda");
    function vuota(fin) {
      sch.innerHTML = '<div class="et">I ' + fmt(nel.length) + ' Comuni del Fondo</div><div class="num rosso" id="big-num">' +
        fmt(R.reduced || fin ? nComm : 0) + '</div><div><strong>hanno il sindaco commissario per i nidi</strong> nel 2024, il ' +
        fmt(100 * nComm / nel.length, 1) + '%. Cerca un Comune o tocca la mappa per vedere i suoi posti, l’obiettivo per il 2026 e i cantieri del Pnrr</div>';
    }
    vuota();
    if (!R.reduced) R.onFirstView(sch, function () { var b = d3.select("#big-num"); if (!b.empty()) R.countUp(b, nComm, function (v) { return fmt(v); }, "play"); });

    function scheda(r) {
      var h = "<h2>" + esc(r.nome) + '</h2><div class="sotto">' + esc(r.sotto) + "</div>";
      if (!r.dentro) return h + '<div class="voce">Il Comune è in una Regione a statuto speciale che non rientra nel Fondo per i nidi: qui non ci sono obiettivi né commissariamenti</div>';
      h += '<div class="voce"><div class="et">Commissariamento per i nidi, 2024</div>';
      if (r.comm === 1) h += '<span class="si">Sì.</span> Il Comune ha certificato di non aver raggiunto l’obiettivo di servizio per il 2024: il sindaco è stato nominato commissario';
      else if (r.comm === 2) h += '<span class="si">Sì.</span> Il Comune non ha inviato la certificazione sui nidi per il 2024: il sindaco è stato nominato commissario';
      else h += "<strong>No.</strong> Il Comune non è nell’elenco dei commissariati per i nidi";
      h += '</div><div class="voce"><div class="et">Posti ogni 100 bambini, 2024/2025</div>';
      if (r.p100 == null) h += "Dato non disponibile";
      else h += '<div class="num' + (r.p100 < 33 ? " rosso" : "") + '">' + fmt(r.p100, 1) + "</div>" +
        (r.posti === 0 ? "Nessun posto nei servizi per la prima infanzia del Comune" : fmt(r.posti) + (r.posti === 1 ? " posto autorizzato" : " posti autorizzati") + ", pubblici e privati") +
        ". Il livello da garantire entro il 2027 è 33";
      h += '</div><div class="voce"><div class="et">Obiettivo 2026</div>';
      h += r.agg > 0 ? "Lo Stato gli chiede di garantire il servizio ad altri <strong>" + fmt(r.agg) + "</strong> " + (r.agg === 1 ? "bambino" : "bambini") + " e gli assegna " + eur(r.euro)
                     : "Nessun posto aggiuntivo assegnato per il 2026";
      h += '</div><div class="voce"><div class="et">Cantieri del Pnrr per asili nido</div>';
      h += r.pn > 0 ? "<strong>" + fmt(r.pn) + "</strong> " + (r.pn === 1 ? "progetto" : "progetti") + " per " + eur(r.peur) + ". A giugno 2026 " +
                      (r.pc === 0 ? "nessuno risultava concluso" : r.pc === 1 ? (r.pn === 1 ? "risultava concluso" : "ne risultava concluso uno") : "ne risultavano conclusi " + fmt(r.pc))
                    : "Nessun progetto";
      return h + "</div>";
    }

    // ---- Mappa ----
    var NS = "http://www.w3.org/2000/svg", VB0 = [0, 0, G.vb[0], G.vb[1]], VB = VB0.slice();
    var box = document.getElementById("mappa");
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", VB.join(" "));
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Mappa dei Comuni italiani: " + fmt(nComm) + " dei " + fmt(nel.length) +
      " Comuni del Fondo hanno il sindaco commissario per i nidi nel 2024. Usa la ricerca per leggere i dati di un Comune.");
    var gC = document.createElementNS(NS, "g"), frag = document.createDocumentFragment(), paths = {};
    Object.keys(G.d).forEach(function (id) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", G.d[id]); p.setAttribute("data-id", id);
      p.setAttribute("class", "c" + (perId[id] && perId[id].dentro ? "" : " fuori"));
      paths[id] = p; frag.appendChild(p);
    });
    gC.appendChild(frag); svg.appendChild(gC);
    var reg = document.createElementNS(NS, "path"); reg.setAttribute("d", G.regioni); reg.setAttribute("class", "reg"); svg.appendChild(reg);
    box.insertBefore(svg, box.firstChild);

    var liv = 0, bot = d3.select("#livelli");
    function colora() {
      var L = LIV[liv];
      Object.keys(paths).forEach(function (id) {
        var r = perId[id], c = FUORI;
        if (r && r.dentro) { var k = r[L.campo]; c = (k == null || k < 0) ? ND : L.classi[k][1]; }
        paths[id].style.fill = c;
      });
      var h = '<span style="width:100%;font-weight:600;color:var(--ink)">' + L.titolo + "</span>";
      L.classi.forEach(function (c) { h += '<span><i class="sw" style="background:' + c[1] + '"></i>' + c[0] + "</span>"; });
      if (liv === 1) h += '<span><i class="sw" style="background:' + ND + '"></i>Dato non disponibile</span>';
      h += '<span><i class="sw" style="background:var(--bg);border:1px solid var(--grey-light)"></i>Fuori dal Fondo (Regioni a statuto speciale)</span>';
      document.getElementById("chiave").innerHTML = h;
      bot.selectAll("button").attr("aria-pressed", function (d, i) { return i === liv ? "true" : "false"; });
    }
    bot.selectAll("button").data(LIV).join("button").attr("type", "button").text(function (d) { return d.nome; })
      .on("click", function (ev, d) { liv = LIV.indexOf(d); colora(); });
    colora();

    var anim = 0;
    function vai(t, subito) {
      cancelAnimationFrame(anim);
      var da = VB.slice(), t0 = performance.now(), dur = (subito || R.reduced) ? 0 : 600;
      (function passo(ora) {
        var a = dur ? Math.min(1, (ora - t0) / dur) : 1; a = d3.easeCubicInOut(a);
        for (var i = 0; i < 4; i++) VB[i] = da[i] + (t[i] - da[i]) * a;
        svg.setAttribute("viewBox", VB.join(" "));
        if (a < 1) anim = requestAnimationFrame(passo);
      })(t0);
    }
    var bIt = document.getElementById("italia"), inp = document.getElementById("cerca"), sug = document.getElementById("sugg");
    var sel = null;
    var zona = document.querySelector(".zona");
    function scegli(id, zoom) {
      var r = perId[id];
      zona.classList.toggle("cercato", !!zoom);
      if (sel) sel.classList.remove("sel");
      sel = paths[id] || null;
      if (sel) { sel.classList.add("sel"); sel.parentNode.appendChild(sel); }
      if (r) { sch.innerHTML = (zoom ? '<button class="torna" type="button" id="torna">← Torna alla mappa</button>' : "") + scheda(r); inp.value = r.nome; }
      var bT = document.getElementById("torna");
      if (bT) bT.addEventListener("click", tornaMappa);
      if (zoom && sel) {
        var bb = sel.getBBox(), m = Math.max(bb.width, bb.height) * 4 + 300, cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
        var w = m, h = m * G.vb[1] / G.vb[0];
        vai([cx - w / 2, cy - h / 2, w, h]); bIt.hidden = false; svg.classList.add("zoom");
      }
      chiudi();
    }
    function tornaMappa() {
      zona.classList.remove("cercato");
      if (sel) { sel.classList.remove("sel"); sel = null; }
      inp.value = ""; vuota(true); vai(VB0); bIt.hidden = true; svg.classList.remove("zoom");
      zona.scrollIntoView({ block: "nearest", behavior: R.reduced ? "auto" : "smooth" });
    }
    bIt.addEventListener("click", function () { vai(VB0); bIt.hidden = true; svg.classList.remove("zoom"); });
    gC.addEventListener("click", function (e) { var id = e.target.getAttribute && e.target.getAttribute("data-id"); if (id) scegli(id, false); });

    // ---- Popup al passaggio (mouse) o al tocco: commissariamento e posti ogni 100 bambini ----
    var tip = R.tooltip(box);
    function popup(e) {
      var id = e.target.getAttribute && e.target.getAttribute("data-id"), r = id && perId[id];
      if (!r) { tip.hide(); return; }
      var rows, note = null;
      if (!r.dentro) { rows = []; note = "Fuori dal Fondo per i nidi (Regione a statuto speciale)"; }
      else {
        rows = [["Sindaco commissario", r.comm > 0 ? '<span style="color:var(--red)">Sì</span>' : "No"],
                ["Posti ogni 100 bambini", r.p100 == null ? "n.d." : fmt(r.p100, 1)]];
        if (r.comm === 1) note = "Obiettivo 2024 non raggiunto";
        else if (r.comm === 2) note = "Certificazione 2024 non inviata";
        else if (r.posti === 0) note = "Nessun posto nel Comune";
      }
      var b = box.getBoundingClientRect();
      tip.show(R.tipHTML({ title: esc(r.nome), value: null, rows: rows, note: note }), e.clientX - b.left, e.clientY - b.top);
    }
    gC.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") popup(e); });
    gC.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") popup(e); });
    gC.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") tip.hide(); });
    R.dismissOutside(box, function () { tip.hide(); });

    var cand = [], att = -1;
    function chiudi() { sug.hidden = true; inp.setAttribute("aria-expanded", "false"); }
    function suggerisci() {
      var q = norm(inp.value); sug.innerHTML = ""; att = -1;
      if (q.length < 2) { chiudi(); return; }
      var ini = [], dentro = [];
      rec.forEach(function (r) { var i = r._n.indexOf(q); if (i === 0) ini.push(r); else if (i > 0) dentro.push(r); });
      cand = ini.sort(function (a, b) { return a._n.length - b._n.length; }).concat(dentro).slice(0, 12);
      if (!cand.length) sug.innerHTML = '<li aria-disabled="true">Nessun Comune con questo nome</li>';
      cand.forEach(function (r) {
        var li = document.createElement("li"); li.setAttribute("role", "option");
        li.innerHTML = esc(r.nome) + " <small>" + esc(r.sotto) + "</small>";
        li.addEventListener("mousedown", function (ev) { ev.preventDefault(); scegli(r.id, true); });
        sug.appendChild(li);
      });
      sug.hidden = false; inp.setAttribute("aria-expanded", "true");
    }
    function evid() { Array.prototype.forEach.call(sug.querySelectorAll("li"), function (li, k) { li.setAttribute("aria-selected", k === att ? "true" : "false"); }); }
    inp.addEventListener("input", suggerisci);
    inp.addEventListener("keydown", function (e) {
      if (sug.hidden) return;
      if (e.key === "ArrowDown") { att = Math.min(att + 1, cand.length - 1); evid(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { att = Math.max(att - 1, 0); evid(); e.preventDefault(); }
      else if (e.key === "Enter") { var r = cand[att < 0 ? 0 : att]; if (r) scegli(r.id, true); e.preventDefault(); }
      else if (e.key === "Escape") chiudi();
    });
    inp.addEventListener("blur", function () { setTimeout(chiudi, 150); });

    var prova = new URLSearchParams(location.search).get("comune");   // solo per le anteprime
    if (prova && perId[prova]) { scegli(prova, new URLSearchParams(location.search).get("cerca") === "1"); }
    R.scheduleHeight();
  }).catch(function (e) { R.fail("#mappa", e); });
})();
</script>
</body>
</html>
