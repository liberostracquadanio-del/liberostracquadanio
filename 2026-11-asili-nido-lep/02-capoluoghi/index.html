<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="radar:titolo" content="Asili nido, i capoluoghi">
<meta name="radar:pubblicato" content="2026-11-14">
<meta name="radar:modificato" content="2026-11-16">
<meta name="radar:altezza-360" content="1007">
<meta name="radar:altezza-640" content="913">
<meta name="radar:modello" content="radar-dataviz">
<title>Asili nido, i capoluoghi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
<script src="../assets/radar.js"></script>
<style>
  .cerca { width: 100%; margin: 24px 0 0; padding: 10px 12px; font: 15px var(--sans); color: var(--ink);
           background: var(--tip-bg); border: 1px solid var(--grey-light); border-radius: 2px; }
  .cerca:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
  .tab-wrap { position: relative; margin-top: 16px; max-height: 520px; overflow: auto; -webkit-overflow-scrolling: touch;
              border-bottom: 1px solid var(--rule); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; z-index: 2; background: var(--bg); text-align: right; vertical-align: bottom;
       font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 0 8px 8px; border-bottom: 1px solid var(--ink);
       cursor: pointer; user-select: none; line-height: 1.25; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--bg); }
  th:first-child { z-index: 3; }
  th[aria-sort="ascending"]::after { content: " ▲"; color: var(--ink); }
  th[aria-sort="descending"]::after { content: " ▼"; color: var(--ink); }
  td { padding: 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
  td:first-child { white-space: normal; min-width: 108px; }
  .sigla { color: var(--ink-2); font-size: 12px; }
  tr.comm td:first-child { font-weight: 700; }
  .barra { display: inline-block; position: relative; width: 64px; height: 10px; margin-left: 8px; vertical-align: -1px;
           background: var(--rule); border-radius: 0 2px 2px 0; }
  .barra i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 0 2px 2px 0; }
  .barra b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink); }
  .si { color: var(--red); font-weight: 700; }
  .si::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red);
                margin-right: 6px; vertical-align: 1px; }
  .no { color: var(--ink-2); }
  .vuoto { padding: 16px 8px; color: var(--ink-2); text-align: left; }
</style>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title" id="titolo">I capoluoghi con il sindaco commissario per i nidi</h1>
  </header>

  <input class="cerca" id="cerca" type="search" placeholder="Cerca un capoluogo" aria-label="Cerca un capoluogo" autocomplete="off">
  <div class="tab-wrap"><table id="tab"></table></div>
  <div class="r-key"><span><i class="sw" style="background:var(--red);border-radius:50%"></i>Sindaco commissario per i nidi</span><span><i class="sw" style="background:var(--blue)"></i>Posti ogni 100 bambini</span></div>

  <footer class="r-foot">
    <span>Fonte: Istat, Ministero dell’Interno (decreti 5 novembre 2025 e 10 marzo 2026), Italia Domani (Progetti del Pnrr)</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt;

  function altezza() {
    var el = document.querySelector(".radar");
    if (!el || window.parent === window) return;
    window.parent.postMessage({ tipo: "radar-altezza", altezza: Math.ceil(el.getBoundingClientRect().height), indirizzo: location.href }, "*");
  }
  var tA;
  function altezzaPresto() { clearTimeout(tA); tA = setTimeout(altezza, 60); }
  window.addEventListener("load", altezza);
  window.addEventListener("resize", altezzaPresto);
  if (window.ResizeObserver) new ResizeObserver(altezzaPresto).observe(document.querySelector(".radar"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(altezzaPresto);

  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  R.loadCSV("../data/capoluoghi.csv").then(function (rows) {
    var dati = rows.map(function (r) {
      return { nome: r["Capoluogo"], sigla: r["Sigla"], reg: r["Regione"], p100: R.num(r["Posti ogni 100 bambini"]),
               posti: R.num(r["Posti"]), comm: +r["Commissariamento"], agg: R.num(r["Posti da aggiungere 2026"]),
               euro: R.num(r["Euro 2026"]), pn: R.num(r["Progetti Pnrr"]), pc: R.num(r["Progetti Pnrr conclusi"]) };
    });
    var nComm = dati.filter(function (d) { return d.comm > 0; }).length;
    var lettere = ["nessun", "un", "due", "tre", "quattro", "cinque", "sei", "sette", "otto", "nove", "dieci"];
    var n = nComm < lettere.length ? lettere[nComm] : fmt(nComm);
    d3.select("#titolo").text(n.charAt(0).toUpperCase() + n.slice(1) + " capoluoghi su " + fmt(dati.length) + " hanno il sindaco commissario per i nidi");

    var TETTO = 60; // barre fino a 60 posti (Nuoro supera 100: barra piena)
    var col = [
      { t: "Capoluogo", k: function (d) { return norm(d.nome); },
        h: function (d) { return esc(d.nome) + ' <span class="sigla">' + esc(d.sigla) + "</span>"; } },
      { t: "Posti ogni<br>100 bambini", k: function (d) { return d.p100; },
        h: function (d) {
          return fmt(d.p100, 1) + '<span class="barra" title="' + esc(fmt(d.posti)) + ' posti"><i style="width:' +
            Math.min(100, 100 * d.p100 / TETTO).toFixed(1) + '%"></i><b style="left:' + (100 * 33 / TETTO).toFixed(1) + '%"></b></span>';
        } },
      { t: "Sindaco<br>commissario", k: function (d) { return d.comm; },
        h: function (d) {
          return d.comm ? '<span class="si" title="' + (d.comm === 1 ? "Obiettivo 2024 non raggiunto" : "Certificazione 2024 non inviata") + '">Sì</span>' : '<span class="no">No</span>';
        } },
      { t: "Posti da aggiungere<br>nel 2026", k: function (d) { return d.agg; },
        h: function (d) { return d.agg ? '<span title="' + esc(fmt(d.euro)) + ' euro assegnati">' + fmt(d.agg) + "</span>" : '<span class="no">–</span>'; } },
      { t: "Cantieri Pnrr<br>conclusi", k: function (d) { return d.pn ? d.pc / d.pn + d.pn / 1e4 : -1; },
        h: function (d) { return d.pn ? fmt(d.pc) + " su " + fmt(d.pn) : '<span class="no">–</span>'; } }
    ];
    var ordine = { i: 1, dir: 1 };
    var tab = d3.select("#tab");
    var head = tab.append("thead").append("tr").selectAll("th").data(col).join("th").attr("scope", "col")
      .attr("tabindex", 0).html(function (c) { return c.t; })
      .on("click keydown", function (ev, c) {
        if (ev.type === "keydown" && ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault();
        var i = col.indexOf(c);
        ordine = { i: i, dir: ordine.i === i ? -ordine.dir : (i === 0 ? 1 : -1) };
        disegna();
      });
    var body = tab.append("tbody");
    var q = "";
    d3.select("#cerca").on("input", function () { q = norm(this.value.trim()); disegna(); });

    function disegna() {
      head.attr("aria-sort", function (c, i) { return i === ordine.i ? (ordine.dir > 0 ? "ascending" : "descending") : null; });
      var k = col[ordine.i].k;
      var vis = dati.filter(function (d) { return !q || norm(d.nome + " " + d.sigla + " " + d.reg).indexOf(q) >= 0; })
        .sort(function (a, b) { var x = k(a), y = k(b); return (x < y ? -1 : x > y ? 1 : 0) * ordine.dir || d3.ascending(a.nome, b.nome); });
      body.selectAll("tr").remove();
      if (!vis.length) { body.append("tr").append("td").attr("colspan", col.length).attr("class", "vuoto").text("Nessun capoluogo con questo nome"); return; }
      body.selectAll("tr").data(vis).join("tr").classed("comm", function (d) { return d.comm > 0; })
        .selectAll("td").data(function (d) { return col.map(function (c) { return c.h(d); }); }).join("td").html(function (h) { return h; });
    }
    disegna();
  }).catch(function (e) { R.fail("#tab", e); });
})();
</script>
</body>
</html>
