<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="radar:titolo" content="Revolut, gli utili degli ultimi cinque anni">
<meta name="radar:pubblicato" content="2026-11-16">
<meta name="radar:modificato" content="2026-11-16">
<meta name="radar:altezza-360" content="700">
<meta name="radar:altezza-640" content="688">
<meta name="radar:modello" content="radar-dataviz">
<title>Revolut, gli utili degli ultimi cinque anni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
<script src="../assets/radar.js"></script>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title">Revolut, da una perdita a 1,7 miliardi di utile in tre anni</h1>
    <p class="r-sub">Utile prima delle imposte del gruppo Revolut, in milioni di sterline (la valuta del bilancio)</p>
  </header>

  <div class="r-big" id="big" aria-hidden="true">
    <span class="r-big__num"><span id="big-num">&nbsp;</span> <span class="r-big__unit">miliardi di sterline</span></span>
    <span class="r-big__label" id="big-label"></span>
  </div>

  <figure class="r-chart" id="utili"></figure>

  <footer class="r-foot">
    <span>Fonte: Revolut Group Holdings Ltd, bilanci consolidati 2022-2025</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt;

  // altezza anche per lo script di incorporamento del repository (incorpora.js)
  function altezza() {
    var el = document.querySelector(".radar");
    if (!el || window.parent === window) return;
    var h = Math.ceil(el.getBoundingClientRect().height);
    window.parent.postMessage({ tipo: "radar-altezza", altezza: h, indirizzo: location.href }, "*");
  }
  var tA;
  function altezzaPresto() { clearTimeout(tA); tA = setTimeout(altezza, 60); }
  window.addEventListener("load", altezza);
  window.addEventListener("resize", altezzaPresto);
  if (window.ResizeObserver) new ResizeObserver(altezzaPresto).observe(document.querySelector(".radar"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(altezzaPresto);

  R.loadCSV("../data/revolut-utili.csv").then(function (rows) {
    // CSV in migliaia di sterline -> milioni
    var dati = rows.map(function (r) {
      return {
        k: r["Anno"],
        ricavi: R.num(r["Ricavi"]) / 1000,
        ante: R.num(r["Utile prima delle imposte"]) / 1000,
        imposte: R.num(r["Imposte"]) / 1000,
        netto: R.num(r["Utile netto"]) / 1000
      };
    });
    var last = dati[dati.length - 1], prev = dati[dati.length - 2], first = dati[0];
    var perdite = dati.filter(function (d) { return d.ante < 0; });
    var growth = last.ante / prev.ante - 1;
    var volte = Math.round(last.ante / first.ante);
    var f0 = function (v) { return fmt(v, 0); };
    var f1 = function (v) { return fmt(v, 1); };
    var segno = function (v) { return (v > 0 ? "+" : "") + f1(v); };

    // ---- Big number (miliardi, un decimale) ----
    var bigNum = d3.select("#big-num");
    d3.select("#big-label").text("di utile prima delle imposte nel " + last.k + ", +" + f1(growth * 100) + "% sul " + prev.k);
    if (R.reduced) bigNum.text(f1(last.ante / 1000));
    else { bigNum.text(f1(0)); R.onFirstView(document.getElementById("big"), function () { R.countUp(bigNum, last.ante / 1000, f1, "play"); }); }

    var host = document.getElementById("utili");
    var tip = R.tooltip(host);
    var clear = function () {};
    R.dismissOutside(host, function () { tip.hide(); clear(); });

    R.responsive(host, function (W, phase) {
      var narrow = R.isNarrow(W);
      var m = { top: narrow ? 58 : 44, right: 0, bottom: 52, left: 0 };
      var H = narrow ? 330 : 380;
      var w = W - m.left - m.right, h = H - m.top - m.bottom;
      var x = d3.scaleBand().domain(dati.map(function (d) { return d.k; })).range([0, w]).paddingInner(narrow ? 0.28 : 0.38).paddingOuter(0.05);
      var minV = d3.min(dati, function (d) { return d.ante; }), maxV = d3.max(dati, function (d) { return d.ante; });
      var y = d3.scaleLinear().domain([Math.min(0, minV), maxV]).range([h, 0]);
      var y0 = y(0);

      d3.select(host).select("svg").remove();
      var svg = d3.select(host).insert("svg", ".r-tip").attr("width", W).attr("height", H).attr("role", "img")
        .attr("aria-label", "Grafico a barre: l'utile prima delle imposte di Revolut passa da " + f0(first.ante) +
          " milioni di sterline nel " + first.k + " a " + f0(last.ante) + " milioni nel " + last.k +
          (perdite.length ? "; nel " + perdite.map(function (d) { return d.k; }).join(" e ") + " una perdita di " +
            perdite.map(function (d) { return f0(-d.ante); }).join(" e ") + " milioni" : "") + ".");
      svg.append("title").text("Utile prima delle imposte di Revolut per anno, in milioni di sterline");
      var g = svg.append("g").attr("transform", "translate(" + m.left + "," + m.top + ")");

      function barPath(d, t) {
        var v = d.ante * t, bx = x(d.k), bw = x.bandwidth();
        if (v >= 0) return R.barPathV(bx, y(v), bw, y0 - y(v), 2);
        // barra negativa: angoli smussati in basso (lato libero)
        var hh = y(v) - y0, r = Math.min(2, bw / 2, hh);
        if (hh <= 0) return "M" + bx + "," + y0 + "h" + bw + "v0h" + (-bw) + "Z";
        return "M" + bx + "," + y0 + "V" + (y0 + hh - r) + "Q" + bx + "," + (y0 + hh) + " " + (bx + r) + "," + (y0 + hh) +
          "H" + (bx + bw - r) + "Q" + (bx + bw) + "," + (y0 + hh) + " " + (bx + bw) + "," + (y0 + hh - r) + "V" + y0 + "Z";
      }
      var bars = g.append("g").selectAll("path").data(dati).join("path").attr("class", "mark")
        .style("fill", function (d) { return d.ante < 0 ? "var(--red)" : "var(--blue)"; });
      R.enter(bars, phase,
        function (s) { s.attr("d", function (d) { return barPath(d, 0); }); },
        function (s) {
          // in fase "static" arriva una selezione (niente attrTween): stato finale diretto
          if (typeof s.attrTween === "function") s.attrTween("d", function (d) { return function (t) { return barPath(d, t); }; });
          else s.attr("d", function (d) { return barPath(d, 1); });
        });

      g.append("line").attr("class", "baseline").attr("x1", 0).attr("x2", w)
        .attr("y1", Math.round(y0) + 0.5).attr("y2", Math.round(y0) + 0.5);

      // valori diretti sulle barre (sopra le positive, sotto le negative)
      var vals = g.append("g").selectAll("text").data(dati).join("text").attr("class", "val-label mark").attr("text-anchor", "middle")
        .attr("x", function (d) { return x(d.k) + x.bandwidth() / 2; })
        .attr("y", function (d) { return d.ante >= 0 ? y(d.ante) - 7 : y(d.ante) + 15; })
        .style("fill", function (d) { return d.ante < 0 ? "var(--red)" : null; });
      vals.each(function (d) { R.countUp(d3.select(this), d.ante, f0, phase); });

      // anni sotto (le negative spingono l'etichetta più in basso)
      var yNeg = y(Math.min(0, minV));
      g.append("g").selectAll("text").data(dati).join("text").attr("class", "tick-label").attr("text-anchor", "middle")
        .attr("x", function (d) { return x(d.k) + x.bandwidth() / 2; }).attr("y", Math.max(y0, yNeg) + 36)
        .style("fill", function (d) { return d === last ? "var(--ink)" : null; })
        .style("font-weight", function (d) { return d === last ? 600 : null; })
        .text(function (d) { return d.k; });

      // ---- Annotazioni (max 2) ----
      var an = g.append("g").attr("class", "anno");
      // 1) l'anno in perdita
      if (perdite.length) {
        var p = perdite[0];
        var cx = x(p.k) + x.bandwidth() / 2, ty = y(maxV * (narrow ? 0.36 : 0.3));
        var t1 = an.append("text").attr("x", cx).attr("y", ty).attr("text-anchor", "middle");
        t1.append("tspan").attr("x", cx).attr("font-weight", 600).text("Unico anno");
        t1.append("tspan").attr("x", cx).attr("dy", 17).attr("font-weight", 600).text("in perdita");
        var tb1 = t1.node().getBBox();
        an.append("path").attr("d", "M" + cx + "," + (tb1.y + tb1.height + 4) + "V" + (y0 - 4));
        an.append("circle").attr("cx", cx).attr("cy", y0 - 2).attr("r", 1.75);
      }
      // 2) la crescita sul primo anno
      var lx = x(last.k) + x.bandwidth() / 2, ly = y(last.ante) - 24;
      var tx = x(prev.k) + x.bandwidth();
      var t2 = an.append("text").attr("x", tx).attr("y", -m.top + 16).attr("text-anchor", "end");
      if (narrow) {
        t2.append("tspan").attr("x", tx).attr("font-weight", 600).text(volte + " volte");
        t2.append("tspan").attr("x", tx).attr("dy", 17).text("l'utile del " + first.k);
      } else {
        t2.append("tspan").attr("font-weight", 600).text(volte + " volte ");
        t2.append("tspan").text("l'utile del " + first.k);
      }
      var tb2 = t2.node().getBBox();
      an.append("path").attr("d", "M" + (tb2.x + tb2.width + 4) + "," + (tb2.y + 9) + "H" + lx + "V" + ly);
      an.append("circle").attr("cx", lx).attr("cy", ly).attr("r", 1.75);
      R.enter(an, phase, function (s) { s.style("opacity", 0); }, function (s) { s.style("opacity", 1); }, R.DUR * 0.7);

      // ---- Interazione ----
      clear = function () { bars.classed("is-dimmed", false); vals.classed("is-dimmed", false); };
      g.append("g").selectAll("rect").data(dati).join("rect").attr("class", "hit")
        .attr("x", function (d) { return x(d.k) - x.step() * x.paddingInner() / 2; }).attr("width", x.step())
        .attr("y", -m.top).attr("height", H)
        .on("pointerenter pointerdown", function (ev, d) {
          bars.classed("is-dimmed", function (q) { return q !== d; });
          vals.classed("is-dimmed", function (q) { return q !== d; });
          var i = dati.indexOf(d), pr = dati[i - 1];
          var note = null;
          if (d.ante < 0 && d.netto > 0) note = "In perdita prima delle imposte, utile netto positivo grazie a un credito d'imposta";
          else if (pr && pr.ante > 0) note = segno((d.ante / pr.ante - 1) * 100) + "% sul " + pr.k;
          tip.show(R.tipHTML({
            title: d.k, value: f1(d.ante), unit: "milioni",
            rows: [["Ricavi", f0(d.ricavi)], ["Imposte", f1(d.imposte)], ["Utile netto", f1(d.netto)]],
            note: note
          }), x(d.k) + x.bandwidth() / 2 + m.left, Math.min(y(Math.max(0, d.ante)), y0) + m.top);
        })
        .on("pointerleave", function (ev) { if (ev.pointerType === "mouse") { tip.hide(); clear(); } });
    });
  }).catch(function (e) { R.fail("#utili", e); });
})();
</script>
</body>
</html>
